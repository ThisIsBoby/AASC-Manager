name: Supabase keep-alive

# Appelle la base chaque jour pour éviter la mise en pause du projet gratuit (7 jours d'inactivité).
on:
  schedule:
    - cron: '0 6 * * *'   # tous les jours à 6h UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel de la fonction keep_alive()
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets Supabase manquants"; exit 1; fi
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status — $(cat response.txt)"
          test "$status" = "200"
